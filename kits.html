<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Town Kits</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ชุดของประกอบฉากสำหรับ 7 เมือง สร้างจากโค้ด three.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap">
<style>
  :root { --bg: #11160f; --panel: rgba(16, 22, 14, 0.88); --line: #3a4a30; --text: #eef3e6; --muted: #a9b89a; --accent: #f2c96b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 Kanit, system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; transform: translate(-50%, -100%); padding: 2px 8px; border-radius: 10px; background: rgba(10, 14, 8, 0.72); color: var(--text); font-size: 13px; white-space: nowrap; pointer-events: auto; cursor: pointer; border: 1px solid transparent; }
  .label:hover, .label.on { border-color: var(--accent); color: var(--accent); }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; background: linear-gradient(var(--panel), rgba(16, 22, 14, 0)); }
  header button { font: inherit; color: var(--text); background: rgba(30, 40, 26, 0.9); border: 1px solid var(--line); border-radius: 18px; padding: 4px 12px; cursor: pointer; }
  header button.on { background: var(--accent); color: #1d1a10; border-color: var(--accent); }
  header .sep { width: 12px; }
  #info { position: fixed; left: 12px; bottom: 12px; max-width: min(460px, calc(100% - 24px)); padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  #info h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #info p { margin: 2px 0 0; color: var(--muted); }
  #help { position: fixed; right: 12px; bottom: 12px; padding: 6px 10px; border-radius: 10px; background: var(--panel); color: var(--muted); font-size: 12px; }
  @media (max-width: 640px) { #help { display: none; } #info h1 { font-size: 17px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<header id="bar"></header>
<div id="info"></div>
<div id="help">ลาก: เลื่อน · คลิกขวาลาก หรือ Q / E: หมุน · ล้อเมาส์: ซูม · คลิกชื่อ: ดูใกล้</div>
<script type="module" src="/src/kits_main.ts"></script>
</body>
</html>
