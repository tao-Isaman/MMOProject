<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Flower Field — MMO prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16210f">
<meta name="description" content="ลานหมู่บ้านจาก Oriverse เดินด้วย WASD โจมตีด้วย Space และร่ายเวททุ่งดอกไม้ด้วยปุ่ม 1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="ลานหมู่บ้าน"></canvas>
<div class="tilt tilt-top" aria-hidden="true"></div>
<div class="tilt tilt-bottom" aria-hidden="true"></div>

<div class="hint" id="hint">
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> เดิน</span>
  <span><kbd>Space</kbd> หรือคลิก โจมตี</span>
  <span><kbd>1</kbd> ร่ายเวท ทุ่งดอกไม้</span>
</div>

<div class="hud" aria-label="แถบสกิล">
  <div class="skillbar" id="skillbar"></div>
</div>

<div class="loading" id="loading">
  <div class="loading-box">
    <p class="loading-title">กำลังโหลดลานหมู่บ้าน…</p>
    <progress id="loading-bar" max="1" value="0"></progress>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
