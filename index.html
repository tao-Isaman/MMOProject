<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Flower Field — MMO prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/app_icon_192.png">
<meta name="theme-color" content="#16210f">
<meta name="description" content="ลานหมู่บ้านจาก Oriverse: เลือกคลาสจอมเวทหรือนักรบ ตีสไลม์เก็บเลเวล ลงแต้มต้นสกิล ความเชี่ยวชาญ และธาตุ แต่งตัว และเก็บของเข้ากระเป๋า">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<canvas id="game" aria-label="ลานหมู่บ้าน"></canvas>
<div class="tilt tilt-top" aria-hidden="true"></div>
<div class="tilt tilt-bottom" aria-hidden="true"></div>


<div class="vitals" id="vitals" aria-label="HP MP และค่าประสบการณ์"></div>
<p class="death hidden" id="death" role="status"></p>

<div class="hud">
  <div class="skillbar" id="skillbar" aria-label="แถบสกิล"></div>
  <div class="menu">
    <button type="button" class="menu-btn" id="btn-skills"><kbd>K</kbd>สกิล</button>
    <button type="button" class="menu-btn" id="btn-status"><kbd>P</kbd>สถานะ</button>
    <button type="button" class="menu-btn" id="btn-inventory"><kbd>I</kbd>กระเป๋า</button>
    <button type="button" class="menu-btn desk-only" id="btn-map"><kbd>M</kbd>แผนที่</button>
    <button type="button" class="menu-btn" id="btn-bot"><kbd>B</kbd><span><span class="desk-only">ตั้งค่า</span>บอท</span></button>
    <button type="button" class="menu-btn auto" id="btn-auto" aria-label="เปิดหรือปิดบอท">▶ ออโต้</button>
    <button type="button" class="menu-btn touch-only" id="btn-full" aria-label="เต็มจอ">⛶</button>
  </div>
</div>

<!-- phones (body.touch): attack button (the skill slots sit around it) and potions -->
<button type="button" class="touch-attack touch-only" id="btn-attack" aria-label="โจมตี"></button>
<div class="touch-potions touch-only">
  <button type="button" class="touch-potion" id="btn-pot-hp" aria-label="ดื่มยาแดง"><span>0</span></button>
  <button type="button" class="touch-potion" id="btn-pot-mp" aria-label="ดื่มยาฟ้า"><span>0</span></button>
</div>
<div class="rotate-note" role="alert">
  <div class="rotate-phone" aria-hidden="true"></div>
  <p>หมุนโทรศัพท์เป็นแนวนอนเพื่อเล่น</p>
  <small>เกมนี้เล่นได้เฉพาะแนวนอน</small>
</div>

<div class="loading" id="loading">
  <div class="loading-box">
    <p class="loading-title">กำลังโหลดลานหมู่บ้าน…</p>
    <progress id="loading-bar" max="1" value="0"></progress>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
